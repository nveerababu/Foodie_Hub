<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Menu Item - FoodieHub</title>
    <style>
      body {
        background-color: #f8f9fa;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }

      form {
        background: #ffffff;
        width: 100%;
        max-width: 460px;
        padding: 35px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        border: 1px solid #eee;
      }

      form h2 {
        margin-top: 0;
        margin-bottom: 22px;
        color: #222;
        text-align: center;
        font-size: 24px;
      }

      form p {
        margin-bottom: 16px;
      }

      form label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: bold;
        color: #444;
      }

      form input[type="text"],
      form input[type="number"],
      form textarea,
      form select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-submit {
        width: 100%;
        background-color: #0d6efd;
        color: #ffffff;
        border: none;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s ease;
      }

      .btn-submit:hover {
        background-color: #e64a19;
      }

      .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #666;
        text-decoration: none;
        font-size: 14px;
      }

      .btn-cancel:hover {
        color: #222;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <form method="POST">
      <h2>✏️ Edit Menu Item</h2>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-submit" onclick="return confirm('Are you sure you want to update this item?');">Update Item</button>
      <a href="/managemenu" class="btn-cancel">Cancel</a>
    </form>
  </body>
</html>
